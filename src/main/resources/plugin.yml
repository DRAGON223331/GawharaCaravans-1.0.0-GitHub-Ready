name: GawharaCaravans
version: 1.1.0
main: com.gawharasmp.caravans.GawharaCaravans
api-version: '26.3'
authors: [GawharaSMP]
description: Random traveling caravans with a Vault and GawharaCoins dual-currency shop.
depend: [Vault, GawharaCoins]
softdepend: [Essentials]
commands:
  caravans:
    description: GawharaCaravans main command
    usage: /caravans <info|locate|spawn|despawn|setcenter|reload>
    aliases: [caravan, gcaravan]
permissions:
  gawharacaravans.use:
    description: Allows players to locate the active caravan.
    default: true
  gawharacaravans.admin:
    description: Allows caravan administration.
    default: op
