# =====================================================
# GawharaCaravans 1.0.0 - GawharaSMP
# Paper 26.3 / Java 25 / Vault Economy
# =====================================================

settings:
  # Caravans spawn ONLY in this world (Overworld). Nether/End/other worlds are never used.
  spawn-world: world
  # These worlds are always blocked, even if added above by mistake.
  blocked-worlds:
    - spawn
  # First caravan after server startup.
  initial-delay-minutes: 10
  # Random delay between later caravans.
  interval-minutes:
    min: 45
    max: 90
  # Time before automatic despawn.
  stay-minutes: 18
  # Broadcast warning this many minutes before a scheduled caravan.
  announce-before-minutes: 2
  # How many safe locations to test before skipping a spawn.
  spawn-attempts: 50
  # The caravan spawns only on a GRASS_BLOCK, never on trees/leaves, and this radius
  # around it must be free of trees, water, lava and steep terrain.
  # (The wagon camp needs about 7 blocks, so the radius is never below 7.)
  clear-radius: 7
  max-height-difference: 1
  # Keep caravans away from the world's spawn point.
  protect-spawn-radius: 180
  # Random position is selected in this ring around the center.
  spawn-radius:
    min: 250
    max: 750
  # If configured, this coordinate becomes the random-spawn center for a world.
  # Set it in-game with /caravans setcenter.
  respect-world-border: true

merchant:
  name: '&b&lGawhara &fTraveling Merchant'
  profession: ARMORER
  llamas: 2
  llama-name: '&eCaravan Llama'
  invulnerable: true
  silent: false

shop:
  title: '&3&lGawhara &8| &bCaravan'
  rows: 4
  currency-label: '$'
  dynamic-prices:
    enabled: true
    min-multiplier: 0.85
    max-multiplier: 1.25
