
name: Build GawharaCaravans

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Find and verify plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="$(find target -maxdepth 1 -type f -name 'GawharaCaravans-*.jar' -print -quit)"
          if [[ -z "$JAR_FILE" ]]; then
            echo "No GawharaCaravans JAR found"
            ls -lah target/ || true
            exit 1
          fi
          echo "Found: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -qx 'plugin.yml'
          jar tf "$JAR_FILE" | grep -qx 'com/gawharasmp/caravans/GawharaCaravans.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GawharaCaravans-JAR
          path: target/GawharaCaravans-*.jar
          if-no-files-found: error
          retention-days: 30
