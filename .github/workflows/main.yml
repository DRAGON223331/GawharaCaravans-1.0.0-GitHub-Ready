name: Build GawharaCaravans

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify plugin JAR contents
        run: |
          test -f target/GawharaCaravans-1.0.0.jar
          jar tf target/GawharaCaravans-1.0.0.jar | grep -q 'plugin.yml'
          jar tf target/GawharaCaravans-1.0.0.jar | grep -q 'com/gawharasmp/caravans/GawharaCaravans.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GawharaCaravans-1.0.0
          path: target/GawharaCaravans-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
